api: 1
id: neon-harbor
name: 夜港霓虹
description: 城市灯火与水面对倒影；右下角一块玻璃面板放时间，底部一排占用条
size: [1480, 720]

background:
  type: media
  path: bg.jpg
  color: "#0a0819"
  fit: cover
  mask:
    path: mask.png
    opacity: 1.0

overlay:
  - text: {text: "LCDMUSE", at: [56, 44], size: 26, bold: true, color: "#ffe8f6"}
  - text: {text: "夜港 · 霓虹", at: [56, 80], size: 14, color: "#b79ad6"}

  - text: {text: "当地", at: [1058, 522], size: 12, color: "#b79ad6"}
  - text: {metric: "time.now", at: [1056, 540], size: 78, bold: true, color: "#fff2fb"}
  - text: {metric: "date.today", at: [1060, 634], size: 15, color: "#c6b0dd"}
  - text: {metric: "uptime.hours", at: [1400, 636], size: 13, color: "#9d86bd",
           unit: " h", prefix: "已运行 ", anchor: "ra"}

  - text: {text: "CPU", at: [64, 618], size: 12, color: "#a58ec6"}
  - text: {metric: "cpu.percent", at: [64, 634], size: 24, bold: true, color: "#7fe3ff",
           unit: "%", decimals: 0}
  - bar:  {metric: "cpu.percent", box: [64, 672, 190, 6], color: "#5fd4ff", track: "#2b2450"}

  - text: {text: "内存", at: [292, 618], size: 12, color: "#a58ec6"}
  - text: {metric: "mem.percent", at: [292, 634], size: 24, bold: true, color: "#b58cff",
           unit: "%", decimals: 0}
  - bar:  {metric: "mem.percent", box: [292, 672, 190, 6], color: "#a97cff", track: "#2b2450"}

  - text: {text: "显存", at: [520, 618], size: 12, color: "#a58ec6"}
  - text: {metric: "gpu.mem_percent", at: [520, 634], size: 24, bold: true, color: "#ffc46b",
           unit: "%", decimals: 0, default: "—"}
  - bar:  {metric: "gpu.mem_percent", box: [520, 672, 190, 6], color: "#ffb85c", track: "#2b2450"}

  - text: {text: "下行", at: [748, 618], size: 12, color: "#a58ec6"}
  - text: {metric: "net.rx_kbps", at: [748, 634], size: 24, bold: true, color: "#ff8fd0",
           unit: " KB/s", decimals: 0}
