api: 1
id: deepsea
name: 深海月光
description: 月光从右上斜射进深海，鲸影在下沉；左侧留白放时间和占用，右半留给桌宠
size: [960, 480]

background:
  type: media
  path: bg.jpg
  color: "#061626"
  fit: cover
  mask:
    path: mask.png
    opacity: 1.0

overlay:
  - text: {text: "LCDMUSE", at: [40, 34], size: 20, bold: true, color: "#dff2fb"}
  - text: {text: "深海月光", at: [40, 62], size: 12, color: "#bcd9e8"}

  - text: {metric: "time.now", at: [40, 246], size: 66, bold: true, color: "#eaf7ff"}
  - text: {metric: "date.today", at: [44, 328], size: 13, color: "#a8cbdd"}
  - text: {metric: "date.weekday", at: [146, 328], size: 12, color: "#8fb2c7", cn: true}

  - text: {text: "CPU", at: [44, 416], size: 12, color: "#a8cbdd"}
  - text: {metric: "cpu.percent", at: [200, 414], size: 13, color: "#7fe3ff", unit: "%",
           decimals: 0, anchor: "ra"}
  - bar:  {metric: "cpu.percent", box: [214, 421, 128, 5], color: "#5fd4ff", track: "#12283a"}

  - text: {text: "内存", at: [44, 440], size: 12, color: "#a8cbdd"}
  - text: {metric: "mem.percent", at: [200, 438], size: 13, color: "#63e6b0", unit: "%",
           decimals: 0, anchor: "ra"}
  - bar:  {metric: "mem.percent", box: [214, 445, 128, 5], color: "#4fd7a2", track: "#12283a"}

  - text: {text: "下潜 3,200 m", at: [886, 448], size: 12, color: "#6e94ab", anchor: "ra"}
