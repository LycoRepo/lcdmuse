name: lcdmuse

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: 单元测试
        run: python -m pytest tests/test_stage1.py -q
      - name: 静态检查
        run: python -m ruff check lcdmuse
      - name: 干净检出也能离线渲染（out/ 不存在）
        run: |
          if (Test-Path out) { Remove-Item -Recurse -Force out }
          python -m lcdmuse.cli render --offline --width 960 --height 480
          if (-not (Test-Path out)) { throw "没有生成 out/" }
      - name: 打 wheel 并独立安装冒烟
        run: |
          python -m pip wheel . -w dist --no-deps
          python -m venv smoke
          smoke\Scripts\python.exe -m pip install --quiet --upgrade pip
          $wheel = (Get-Item dist\lcdmuse-*.whl).FullName
          smoke\Scripts\python.exe -m pip install --quiet $wheel
          smoke\Scripts\python.exe -P -m lcdmuse.cli drivers list | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "wheel 安装后无法列出驱动" }
          $out = smoke\Scripts\python.exe -P -m lcdmuse.cli render --offline --width 960 --height 480
          $out | Write-Host
          if ($LASTEXITCODE -ne 0 -or -not (($out -join "`n" | ConvertFrom-Json).ok)) { throw "wheel 安装后离线渲染失败" }
